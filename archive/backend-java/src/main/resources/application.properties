# ─── Application ───
server.port=${PORT:5000}
spring.application.name=scms-backend

# ─── Frontend Static Files ───
# Configurable via FRONTEND_PATH env var. Default: sibling ../frontend/ directory.
# In production, set to the absolute path where frontend files are deployed.
spring.web.resources.static-locations=file:${FRONTEND_PATH:../frontend/}

# ─── CORS ───
# Comma-separated list of allowed origins. Default supports common dev ports.
# In production, set to your actual frontend domain(s).
# Example: CORS_ALLOWED_ORIGINS=https://scms.met.edu,https://www.met.edu
scms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:3000,http://localhost:5500,http://localhost:8080,http://127.0.0.1:5000}

# ─── Data Store ───
# Path to the JSON database file. Configurable for deployment environments.
scms.data.db-path=${DB_FILE_PATH:data/db.json}

# ─── Jackson JSON ───
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ───
# Production: INFO level. Override with LOG_LEVEL env var for debugging.
logging.level.edu.met.scms=${LOG_LEVEL:INFO}
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── Server ───
# Graceful shutdown for deployment platforms
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ─── Error Handling ───
# Never expose stack traces in production HTTP responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
